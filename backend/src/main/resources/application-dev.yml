spring:
  datasource:
    url: jdbc:h2:mem:cmdcentre;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      # Convenience for local development only. `dev` is the default profile, so this also means
      # the console must never be reachable from outside the machine — see docs/SECURITY.md.
      enabled: true
      path: /h2-console

app:
  jwt:
    # A development-only key, kept out of application.yml so that no other profile can inherit it.
    # The `prod` profile has no default at all and refuses to start without JWT_SECRET.
    secret: ${JWT_SECRET:dev-only-local-signing-key-change-me-0123456789}
  seed:
    # Opt-in demo dataset for screenshots/first-run walkthroughs. See DemoDataSeeder.
    demo-data: ${APP_SEED_DEMO:false}
