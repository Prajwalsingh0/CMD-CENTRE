spring:
  datasource:
    url: jdbc:h2:mem:cmdcentre-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.H2Dialect

app:
  jwt:
    secret: test-secret-value-0123456789abcdef0123456789abcdef
  storage:
    location: ${java.io.tmpdir}/cmd-centre-test-uploads
  ai:
    provider: local
  research:
    web-enabled: false
  seed:
    demo-data: false
